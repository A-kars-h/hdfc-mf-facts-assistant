[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfc-mf-ragbot"
version = "0.1.0"
description = "Facts-only RAG assistant for HDFC mutual fund Direct Growth FAQs"
# No `readme =` yet: README.md is a Phase 8 deliverable and does not exist.
# Pointing at a missing file makes `pip install -e .` fail with a confusing
# metadata error, so the key is added when the file is written.

# 3.10, not 3.11. The build environment is 3.10.7 (Phase 0 finding 7) and every
# construct used here is valid on 3.10. Pinning 3.11+ would exclude the machine
# this was actually verified on for no benefit.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phased so `pip install -e .` during Phases 1-3 does not pull ~2.5GB of torch.
phase2 = ["chromadb", "sentence-transformers"]
phase3 = ["rank-bm25", "numpy"]
phase7 = ["streamlit"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
# Namespace-style `src/` layout, matching the import path the Phase 1
# Done-when check uses: `from src.ragbot.core import ...`
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Makes `src.ragbot...` importable without an editable install, so a fresh
# clone can run `python -m pytest tests -q` with no setup step.
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: hits the network; deselect with -m 'not slow'",
    "integration: needs a built index or the network",
]
filterwarnings = ["error::DeprecationWarning:src.ragbot.*"]
